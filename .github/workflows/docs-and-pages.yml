name: Documentation & GitHub Pages

'on':
  push:
    branches:
      - main
    paths:
      - 'Formula/**.rb'
      - 'scripts/**'
      - '.github/workflows/docs-and-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Formula/**.rb'
      - 'scripts/**'
      - '.github/workflows/docs-and-pages.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and repo write for README updates
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation & Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate README.md and GitHub Pages site
        run: |
          python3 scripts/generate_docs.py

      - name: Commit and push updated README.md
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            echo "Changes detected in README.md. Committing and pushing..."
            git add README.md
            git commit -m "docs: auto-update README.md [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes detected in README.md."
          fi

      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Release GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
